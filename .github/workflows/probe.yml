name: Screenshot probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Probe GUI session and screencapture
        run: |
          set -x
          sw_vers
          who || true
          launchctl managername || true
          system_profiler SPDisplaysDataType | head -30 || true
          mkdir -p out
          screencapture -x out/full.png && ls -la out || echo "screencapture failed"
          sips -g pixelWidth -g pixelHeight out/full.png || true
          open -a "System Settings" || true
          sleep 6
          screencapture -x out/settings.png || true
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' || true
          ls -la out
      - name: Publish images to probe-out branch
        run: |
          git config user.name "ci-probe"
          git config user.email "ci-probe@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rf --cached . >/dev/null
          git add -f out/*.png
          git commit -m "probe screenshots"
          git push -f origin probe-out
